<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'><title>미수 현황</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}html{overflow-y:auto}body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#fff;color:#1a1a1a;font-size:14px;position:relative}
.wrap{max-width:100%;margin:0;padding:6px 0 30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #c8d2de;padding:0 0 12px;margin-bottom:20px}.hgroup{display:flex;align-items:center;gap:18px}.logo{height:52px;width:auto;object-fit:contain}.htitle{font-size:20px;font-weight:700;color:#1a1a1a;letter-spacing:-0.3px;line-height:1.25;display:flex;align-items:center}.htitle:before{content:'';width:4px;height:18px;background:#14305c;margin-right:9px;flex:none}.hsub{font-size:12px;letter-spacing:2px;color:#888;margin-top:2px;padding-left:13px}.syslink{background:#1B3A6B;color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:9px 15px;border-radius:0;white-space:nowrap}.syslink:hover{background:#14305c}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:#6b7280;margin-bottom:12px;padding:9px 14px;background:#f4f6fb;border:1px solid #e5e9f0;border-radius:0}.legend i{display:inline-block;width:9px;height:9px;border-radius:0;margin-right:5px}.legend b{color:#1a1a1a;font-weight:600}.legend .tag{margin-right:5px}
.stlegend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:11px;color:#6b7280;background:#f4f6fb;border:1px solid #e5e9f0;border-radius:0;padding:5px 12px;line-height:1.4;margin-left:auto;margin-right:-14px}.stlegend b{color:#1a1a1a;font-weight:600}.stlegend .tag{margin-right:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.kpi{background:#EAF1FB;border:none;border-radius:0;padding:12px 14px;transition:box-shadow .12s}
.kpi.hi{background:#1B3A6B;color:#fff}
.kpi.click{cursor:pointer}.kpi.active{box-shadow:inset 0 0 0 2px #1B3A6B}.kpis:has(.kpi.click:hover) .kpi.active:not(:hover){box-shadow:none}.kpi.click:hover{box-shadow:inset 0 0 0 2px #1B3A6B}
#klong{background:#fdecea}#klong.active,#klong.click:hover{box-shadow:inset 0 0 0 2px #dc2626}
.kpi .k{font-size:12px;color:#6b7280}.kpi.hi .k{color:#ccdcf5}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-0.5px}.kpi .v small{font-size:12px;font-weight:600;margin-left:2px}
.kpi .x{font-size:11px;color:#9ca3af;margin-top:3px}.kpi.hi .x{color:#9db8dd}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.chcard{background:#fff;border:1px solid #e5e9f0;border-radius:0;padding:14px 16px 16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:border-color .12s}.chcard:hover{border-color:#c8d2de}
.chcard h3{font-size:13px;font-weight:700;margin:0 0 12px;color:#1a1a1a}.chcard h3 span{font-size:11px;color:#6b7280;font-weight:500}
.cbhead{display:flex;justify-content:space-between;font-size:11px;color:#888;font-weight:500;margin:2px 0 8px;padding-bottom:5px;border-bottom:1px solid #e5e5e5}.cbrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.cbname{width:100px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#334155}
.cbbar{flex:1;background:#f4f6fb;border-radius:0;height:16px;overflow:hidden}
.cbfill{height:100%;border-radius:0}
.cbval{width:84px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:#1a1a1a;font-weight:700}.cbdate{font-size:10px;color:#9ca3af;font-weight:400;margin-top:1px}
.cbempty{color:#9ca3af;font-size:13px;padding:14px 0}
/* 재고 카테고리 툴바(.inv-toolbar)와 동일: 흰 바 + 하단 1px + 옅은 그림자, 플랫 검색창 */
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px;min-height:36px;padding:4px 14px;background:#fff;border:0;border-bottom:1px solid #e5e5e5;box-shadow:0 2px 6px rgba(15,23,42,.06);box-sizing:border-box}
.search{flex:0 1 auto;min-width:0}
.search input{width:300px;max-width:100%;height:26px;box-sizing:border-box;padding:4px 6px;margin:0;border:none;border-radius:0;background:transparent;outline:none;font-size:13px;font-family:inherit;color:#14305c}
.search input:hover{background:rgba(27,58,107,.045)}
.search input:focus{background:#f2f4f7}
.search input::placeholder{color:#aab4c2}
.tooldiv{width:1px;height:18px;background:#e5e5e5;flex-shrink:0;margin:0 4px}
.toollab{font-size:12.5px;font-weight:700;color:#14305c;white-space:nowrap;flex-shrink:0}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:0;flex:none}.regtoggle{display:flex;gap:4px;flex:none}
.regtoggle button,.chip{display:inline-flex;align-items:center;border:1px solid #e0e0e0;background:#fff;padding:3px 11px;font-size:11.5px;font-weight:400;font-family:inherit;cursor:pointer;color:#444;border-radius:0;line-height:1.4;transition:background .12s,border-color .12s}
.regtoggle button.on,.chip.on{background:#1B3A6B;color:#fff;border-color:#1B3A6B;font-weight:700}
.regtoggle button:hover:not(.on),.chip:hover:not(.on){background:#f6f8fa;border-color:#cbd2dc}
.cc{font-weight:700;margin-left:4px}
.card{background:#fff;border:1px solid #d6deea;border-radius:0;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:left}
th{font-size:12px;color:#888;font-weight:500;background:#fafafa;border-bottom:1px solid #e5e5e5}
td{border-bottom:1px solid #f0f0f0}
th:first-child,td:first-child{padding-left:16px}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.main{cursor:pointer} tr.main:hover{background:#fafafa}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;width:fit-content}
.t장기미수{background:#dc2626;color:#fff}.t미수{background:#fee2e2;color:#dc2626}.t진행{background:#eaf1fb;color:#14305c}.t완납{background:#f4f8fe;color:#2f5288}
.reg{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px} .rs{background:#eaf1fb;color:#14305c} .rh{background:#fbede3;color:#b45309}
.expand{font-size:11px;color:#9ca3af}
.detail td{background:#fafafa;padding:0}
.dbox{padding:14px 18px}
.effort{font-size:13px;padding:8px 12px;border-radius:0;margin-bottom:12px}
.eff-good{background:#eafaf1;color:#15803d}.eff-warn{background:#fbede3;color:#b45309}.eff-bad{background:#fdecea;color:#dc2626}
.deps{width:100%;font-size:12.5px}.deps th{background:#fafafa;color:#888;font-weight:500;border-bottom:1px solid #e5e5e5}.deps td{padding:6px 10px;border-bottom:1px solid #f0f0f0}
.empty{padding:40px;text-align:center;color:#ccc;font-size:14px}
.note{font-size:12px;color:#9ca3af;margin-top:18px}
@media(max-width:1024px){.charts{grid-template-columns:1fr}}@media(max-width:680px){.kpis{grid-template-columns:1fr}.htitle{font-size:17px}.hsub{font-size:11px;letter-spacing:1px}.logo{height:40px}.top{gap:10px;margin-bottom:14px}.legend{font-size:11px;gap:10px;padding:8px 10px}.card{overflow:hidden}table{min-width:0;width:100%}th,td{padding:9px 6px;font-size:12px}th:first-child,td:first-child{padding-left:10px}th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}.reg{white-space:nowrap}td:first-child,th:first-child{white-space:normal;word-break:break-all}.toolbar .search{flex:1 1 100%}.search input{width:100%}.wrap{padding:6px 0 40px}}
.modal{position:absolute;top:0;left:0;width:100%;height:100%;background:transparent;display:none;z-index:100}.modal.open{display:block}.modalbox{position:absolute;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:0;border:1px solid #c8d2de;width:calc(100% - 32px);max-width:560px;max-height:82vh;overflow:auto;padding:24px 26px 26px;box-shadow:0 24px 70px rgba(20,30,50,.28),0 0 110px 26px rgba(27,58,107,.20)}.mclose{position:absolute;top:10px;right:14px;font-size:24px;line-height:1;color:#9ca3af;cursor:pointer;border:none;background:none}.mclose:hover{color:#555}.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:1px solid #e5e5e5;padding-bottom:14px;margin-bottom:14px}.mname{font-size:20px;font-weight:800;color:#1a1a1a;letter-spacing:-0.3px}.msub{font-size:12.5px;color:#6b7280;margin-top:4px}.mamt{font-size:14px;color:#475569}.mamt b{font-size:24px;font-weight:800;color:#1B3A6B;margin-left:6px}.mdh{font-size:12px;color:#888;font-weight:500;margin:16px 0 6px}</style></head><body><div class=wrap>
@@ADMINBADGE@@<div id=hsub style="font-size:11px;color:#6b7280;letter-spacing:normal;margin:9px 0 14px"><b style="color:#334155;white-space:nowrap">현재 자료</b>&nbsp;&nbsp;@@BASIS@@ 기준</div>
<div class=kpis>
 <div class='kpi hi'><div class=k id=kLab1>전체 총 미수액</div><div class=v id=kAmt>8.2억<small>원</small></div><div class=x id=kAmtSub>818,564,943원 · 미수+장기미수 기준</div></div>
 <div class='kpi click' data-f=unpaid id=kall><div class=k id=kLab2>전체 미수 거래처</div><div class=v><span id=kUnp>33</span><small>곳</small></div></div>
 <div class='kpi click' data-f=장기미수 id=klong><div class=k id=kLab3>전체 장기미수</div><div class=v><span id=kLong>25</span><small>곳</small></div></div>
</div>

@@CHARTS@@
<div class=toolbar>
 <div class=search><input id=q placeholder='거래처명 검색…' autocomplete=off oninput='render();fitVP&&fitVP()'></div>
 <span class=tooldiv></span>
 <span class=toollab>지점</span>
 <div class=regtoggle>
  <button class=on data-r=all onclick='setR(this)'>전체</button>
  <button data-r=서울 onclick='setR(this)'>서울</button>
  <button data-r=화성 onclick='setR(this)'>화성</button>
 </div>
 <span class=tooldiv></span>
 <span class=toollab>상태</span>
 <div class=chips>
  <div class=chip data-f=all onclick='setF(this)'>전체 <b class=cc>302</b></div>
  <div class='chip on' data-f=unpaid onclick='setF(this)'>미수 전체 <b class=cc>33</b></div>
  <div class=chip data-f=미수 onclick='setF(this)'>미수 <b class=cc>8</b></div>
  <div class=chip data-f=장기미수 onclick='setF(this)'>장기미수 <b class=cc>25</b></div>
  <div class=chip data-f=진행 onclick='setF(this)'>진행 <b class=cc>54</b></div>
  <div class=chip data-f=완납 onclick='setF(this)'>완납 <b class=cc>215</b></div>
 </div>
 <span class=tooldiv></span>
 <div class=stlegend>
  <span><span class="tag t완납">완납</span><b>입금 완료</b></span>
  <span><span class="tag t진행">진행</span><b>결제기한 내(미수 아님)</b></span>
  <span><span class="tag t미수">미수</span><b>결제기한 경과</b></span>
  <span><span class="tag t장기미수">장기미수</span><b>결제기한 1개월 이상 경과</b></span>
 </div>
</div>

<div class=card><table>
<thead><tr><th>거래처</th><th class=c>지역</th><th class=num>미수액(원)</th><th class=c>상태</th><th class=c>결제조건</th><th class=c>최근입금</th></tr></thead>
<tbody id=tb></tbody></table></div></div>

<script>
const DATA=@@DATA@@;
const ADMIN=@@ADMIN@@;
let FILTER='unpaid';let REGION='all';
function gotoNyung(biz){
 // 같은 출처(same-origin)이므로 상단 창의 '숨은 네이티브 버튼'을 직접 클릭 → Streamlit 재실행(세션 유지, 새로고침 없음).
 // 막 깨어난 직후엔 숨은 버튼이 아직 안 그려졌을 수 있어, 못 찾으면 잠깐씩 기다리며 재시도.
 function tryClick(){
  var docs=[];
  try{ if(window.top && window.top.document) docs.push(window.top.document); }catch(e){}
  try{ if(window.parent && window.parent.document && docs.indexOf(window.parent.document)<0) docs.push(window.parent.document); }catch(e){}
  for(var d=0; d<docs.length; d++){
   try{
    var btns=docs[d].querySelectorAll('.st-key-nytrig button');
    for(var i=0;i<btns.length;i++){
     if((btns[i].innerText||btns[i].textContent||'').trim()==='NYO_'+biz){ btns[i].click(); return true; }
    }
   }catch(e){}
  }
  return false;
 }
 if(tryClick()) return true;
 var tries=0;
 var iv=setInterval(function(){
  tries++;
  if(tryClick()){ clearInterval(iv); return; }
  if(tries>=24){ clearInterval(iv); alert('화면이 아직 준비 중입니다. 잠시 후 다시 눌러 주세요.'); }
 }, 250);   // 최대 ~6초 재시도
 return false;
}
function won(x){return (x||0).toLocaleString('ko-KR')}
function eok(x){return (x/1e8).toFixed(1)+'억'}
function regCount(){const f={all:0,unpaid:0,미수:0,장기미수:0,진행:0,완납:0};let amt=0;
 DATA.forEach(o=>{if(REGION!=='all'&&o.reg!==REGION)return;f.all++;
  if(o.status==='미수'||o.status==='장기미수'){f.unpaid++;amt+=o.amt;}
  if(f[o.status]!==undefined)f[o.status]++;});return {f:f,amt:amt};}
function updateCounts(){const r=regCount();
 document.querySelectorAll('.chip').forEach(c=>{const b=c.querySelector('.cc');if(b)b.textContent=r.f[c.dataset.f];});
 document.getElementById('kAmt').innerHTML=eok(r.amt)+'<small>원</small>';
 document.getElementById('kAmtSub').textContent=won(r.amt)+'원 · 미수+장기미수 기준';
 document.getElementById('kUnp').textContent=r.f.unpaid;
 document.getElementById('kLong').textContent=r.f['장기미수'];
 const rn=REGION==='all'?'전체':REGION;
 document.getElementById('kLab1').textContent=rn+' 총 미수액';
 document.getElementById('kLab2').textContent=rn+' 미수 거래처';
 document.getElementById('kLab3').textContent=rn+' 장기미수';}
function isUnpaid(o){return o.status==='미수'||o.status==='장기미수'}
function setF(el){FILTER=el.dataset.f;chipSync();render();fitVP&&fitVP()}
function setRegion(reg){REGION=reg;document.querySelectorAll('.regtoggle button').forEach(b=>b.classList.toggle('on',b.dataset.r===reg));updateCounts();render();fitVP&&fitVP()}
function setR(el){setRegion(el.dataset.r)}
function chipSync(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===FILTER));
 document.getElementById('kall').classList.toggle('active',FILTER==='unpaid');
 document.getElementById('klong').classList.toggle('active',FILTER==='장기미수')}
document.getElementById('kall').onclick=()=>{FILTER='unpaid';chipSync();render()};
document.getElementById('klong').onclick=()=>{FILTER='장기미수';chipSync();render()};
function effort(o){
 if(!isUnpaid(o)) return ['eff-good', o.status==='완납'?'완납 — 미수 없음':'진행 — 기한 내 (미수 아님)'];
 if(!o.last_dep) return ['eff-bad','입금 이력이 없습니다 — 회수 노력 필요'];
 const s=o.since;
 if(s<=45) return ['eff-good','최근 입금 '+o.last_dep+' — 상환 진행 중'];
 if(s<=120) return ['eff-warn','마지막 입금 '+o.last_dep+' — 경과 주시'];
 return ['eff-bad','마지막 입금 '+o.last_dep+' — 장기간 입금 없음'];
}
function render(){
 const q=document.getElementById('q').value.trim();
 let rows=DATA.filter(o=>{const s=(FILTER==='all')?true:((FILTER==='unpaid')?isUnpaid(o):(o.status===FILTER));return s&&(REGION==='all'||o.reg===REGION)});
 if(q) rows=rows.filter(o=>o.name.includes(q));
 rows.sort((a,b)=>b.amt-a.amt||a.name.localeCompare(b.name,'ko'));
 const tb=document.getElementById('tb');
 if(!rows.length){tb.innerHTML='<tr><td colspan=6 class=empty>해당하는 거래처가 없습니다.</td></tr>';return}
 tb.innerHTML=rows.map((o,i)=>{
  const reg='<span class="reg '+(o.reg==='서울'?'rs':'rh')+'">'+o.reg+'</span>';
  const lastd=o.last_dep||'<span style=color:#dc2626>없음</span>';
  const main='<tr class=main onclick="openModal(this,&#39;'+o.biz+'&#39;)"><td>'+o.name+' <span class=expand>›</span></td><td class=c>'+reg+'</td><td class=num>'+(o.amt>0?won(o.amt):'-')+'</td><td class=c><span class="tag t'+o.status+'">'+o.status+'</span></td><td class=c><span style="font-size:11px;color:#6b7280">'+o.ruledisp+'</span></td><td class=c>'+lastd+'</td></tr>';
  const [ec,et]=effort(o);
  let dep=o.deps.length?('<table class=deps><thead><tr><th>입금일</th><th class=num>입금액(원)</th></tr></thead><tbody>'+o.deps.slice(-5).reverse().map(x=>'<tr><td>'+x.d+'</td><td class=num>'+won(x.a)+'</td></tr>').join('')+'</tbody></table>'):'<div style="color:#9ca3af;font-size:13px">기록된 입금 내역이 없습니다.</div>';
  const det='<tr class=detail id=d'+i+' style=display:none><td colspan=6><div class=dbox>'+
    '<div class="effort '+ec+'">'+et+'</div>'+
    '<div style="font-size:12px;color:#888;font-weight:500;margin-bottom:6px">최근 입금 이력</div>'+dep+'</div></td></tr>';
  return main;
 }).join('');
}
function openModal(rowEl,biz){const o=DATA.find(x=>x.biz===biz);if(!o)return;const ef=effort(o);const reg='<span class="reg '+(o.reg==='서울'?'rs':'rh')+'">'+o.reg+'</span>';const dep=o.deps.length?('<table class=deps><thead><tr><th>입금일</th><th class=num>입금액(원)</th></tr></thead><tbody>'+o.deps.slice().reverse().map(x=>'<tr><td>'+x.d+'</td><td class=num>'+won(x.a)+'</td></tr>').join('')+'</tbody></table>'):'<div style="color:#9ca3af;font-size:13px">기록된 입금 내역이 없습니다.</div>';document.getElementById('modalBody').innerHTML='<button class=mclose onclick="closeModal()">×</button><div class=mhead><div><div class=mname style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'+o.name+'<span class="tag t'+o.status+'" style="font-size:12px;padding:3px 10px">'+o.status+'</span></div><div class=msub>'+reg+' · 결제조건 '+o.ruledisp+'</div></div></div><div class=mamt>미수액 <b>'+(o.amt>0?won(o.amt)+'원':'-')+'</b></div><div class="effort '+ef[0]+'" style="margin:14px 0">'+ef[1]+'</div><div class=mdh>입금 이력</div>'+dep+((o.status==='장기미수')?'<div style="margin-top:18px;border-top:1px solid #e5e5e5;padding-top:16px"><button onclick="gotoNyung(&#39;'+o.biz+'&#39;)" style="width:100%;background:#dc2626;color:#fff;border:none;border-radius:0;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer">내용증명 서류 작성</button><div style="font-size:11px;color:#9ca3af;margin-top:7px;text-align:center">거래처명·미수액·관할·연락처가 자동으로 채워집니다 (수정 가능)</div></div>':'');document.getElementById('modal').classList.add('open');centerModal(document.getElementById('modalBody'));fitVP();}
function closeModal(){document.getElementById('modal').classList.remove('open');_cmEl=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function topOff(){try{let o=0,w=window;while(w!==window.top&&w.frameElement){o+=w.frameElement.getBoundingClientRect().top+(w.parent.scrollY||w.parent.pageYOffset||0);w=w.parent;}return o;}catch(e){return 0;}}
function fitVP(){try{const fe=window.frameElement;if(fe)fe.style.height=(document.documentElement.scrollHeight+8)+"px";}catch(e){}}
function visTop(){try{return (window.top.scrollY||window.top.pageYOffset||0)-topOff();}catch(e){return 0;}}
/* 팝업을 '보이는 화면' 정중앙에: 프레임 rect.top 누적(각 단계 스크롤 자동 반영)으로 뷰포트 기준 위치 계산.
   로컬(1겹)·운영 Streamlit Cloud(2겹: 셸>앱>컴포넌트) 모두 동일하게 동작 */
function _cmCalc(el){
  var o=0,w=window;
  try{while(w!==window.top&&w.frameElement){o+=w.frameElement.getBoundingClientRect().top;w=w.parent;}}catch(e){}
  var vh=0; try{vh=window.top.innerHeight||window.top.document.documentElement.clientHeight||0;}catch(e){}
  if(!vh) vh=window.innerHeight;
  el.style.maxHeight=Math.round(vh*0.82)+'px';  /* 최대 높이도 '보이는 화면' 기준(82%) */
  var c=(-o)+vh/2;
  var h=el.offsetHeight||0;
  if(h){var maxC=Math.max(document.documentElement.scrollHeight-h/2-8,h/2+8);c=Math.min(Math.max(c,h/2+8),maxC);}
  el.style.top=c+'px';
}
var _cmEl=null,_cmHooked=false,_cmFn=null;
function centerModal(el){
  _cmEl=el; _cmCalc(el);
  requestAnimationFrame(function(){ if(_cmEl===el)_cmCalc(el); });
  if(!_cmHooked){
    _cmHooked=true;
    _cmFn=function(){ if(_cmEl)_cmCalc(_cmEl); };
    var w=window;
    try{ while(true){ w.addEventListener('scroll',_cmFn,{passive:true}); w.addEventListener('resize',_cmFn); if(w===window.top)break; w=w.parent; } }catch(e){}
  }
}
chipSync();updateCounts();render();fitVP();
setTimeout(fitVP,150);setTimeout(fitVP,600);setTimeout(fitVP,1500);
try{document.fonts&&document.fonts.ready.then(fitVP);}catch(e){}
window.addEventListener("load",fitVP);
try{window.top.addEventListener("resize",fitVP);}catch(e){window.addEventListener("resize",fitVP);}
